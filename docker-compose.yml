name: hmongtea-crm-d9

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: hmongtea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hmongtea
    ports:
      - "127.0.0.1:3298:5432"
    volumes:
      - hmongtea-pg:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmongtea -d hmongtea"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "3299:3299"
    environment:
      DATABASE_URL: postgres://hmongtea:${POSTGRES_PASSWORD}@db:5432/hmongtea
      PORT: "3299"
      HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:3299
      STAFF_EMAIL: ${STAFF_EMAIL:?set STAFF_EMAIL}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?set STAFF_PASSWORD}
      CUSTOMER_EMAIL: ${CUSTOMER_EMAIL:-}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:-}
      PARTNER_EMAIL: ${PARTNER_EMAIL:-}
      PARTNER_PASSWORD: ${PARTNER_PASSWORD:-}
      TAX_ID_KEY: ${TAX_ID_KEY:?set TAX_ID_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - hmongtea-data:/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: "500"

volumes:
  hmongtea-pg:
  hmongtea-data:
